[project]
name = "sqlamodels"
version = "0.1.9"
description = "generate sqlalchemy models from tables"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.2.1",
    "jinja2>=3.1.6",
    "pymysql>=1.2.0,<2",
    "sqlalchemy>=2.0.43",
]

[project.scripts]
sqlamodels = "sqlamodels.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    '^fabfile\.py$', # Excludes specific file using literal string (single quotes)
    'tests/',        # Excludes anything matching this path substring
]


[tool.ruff]
line-length = 120
[tool.ruff.lint]

select = ["ALL"]

ignore = [
    "CPY001", # Missing copyright notice at top of file
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D203",    # Incompatible with D211, which is enabled by default docstrings...
    "D213",    # incompatible with D212, which is enabled by default
    "COM812",  # missing trailing comma. redundant with ruff formatting
    "DTZ005",  # Don't require timezone-aware datetimes
    "S603",    # subprocess call: check for execution of untrusted input
    # "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed 
    "PLW2901", # loop variable overwritten.
    "ERA001",  # found commented out code
    "S704",    # unsafe use of MarkupSafe
    # "T201",    # print statements found
    "PLC0415", # import should be at top of file
]
[tool.ruff.lint.isort]
combine-as-imports = true
